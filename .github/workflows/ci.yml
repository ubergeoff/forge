name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build affected packages
        run: npx nx affected --target=build --base=origin/main --head=HEAD --exclude=docs,hello-world,counter-app

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run affected unit tests
        run: npx nx affected --target=test --base=origin/main --head=HEAD --exclude=docs,hello-world

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3

  e2e:
    name: E2E (counter-app)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build forge packages
        run: npx nx run-many --target=build --projects=core,compiler,router,cli

      - name: Build counter-app
        run: cd examples/counter-app && node ../../packages/cli/dist/bin.js build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: examples/counter-app

      - name: Run Playwright e2e tests
        run: npm run e2e
        working-directory: examples/counter-app

      #- name: Upload Playwright report
